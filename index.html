<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raio-X do seu Evento Cristão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241f;
    --paper:#f4efe4;
    --paper-2:#ece4d2;
    --petrol:#0f3b3a;
    --petrol-2:#16524f;
    --amber:#c8862b;
    --amber-bright:#e0a23d;
    --film:#0a2120;
    --line:rgba(15,59,58,0.18);
    --crit:#a3402f;
    --dev:#c8862b;
    --maturo:#2f6b4f;
    --shadow: 0 18px 40px rgba(10,33,32,0.18);
    --radius: 2px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(200,134,43,0.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(22,82,79,0.10), transparent 50%),
      var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    max-width:760px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* ---------- Topbar / progress ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    background:linear-gradient(180deg, var(--paper) 78%, transparent);
    padding:14px 0 18px;
  }
  .topbar-inner{
    max-width:760px;
    margin:0 auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-mark{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--petrol);
    text-transform:uppercase;
    white-space:nowrap;
    opacity:0.75;
  }
  .progress-track{
    flex:1;
    height:3px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    background:linear-gradient(90deg, var(--petrol), var(--amber));
    transition:width 0.5s cubic-bezier(.65,0,.35,1);
  }
  .progress-pct{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--petrol);
    opacity:0.75;
    min-width:32px;
    text-align:right;
  }

  /* ---------- Screens ---------- */
  .screen{display:none;}
  .screen.active{display:block; animation:rise 0.5s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Intro ---------- */
  .intro-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--amber);
    background:var(--film);
    display:inline-block;
    padding:6px 12px;
    margin-bottom:22px;
  }
  .intro-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(34px, 7vw, 58px);
    line-height:1.04;
    letter-spacing:-0.01em;
    margin:0 0 18px;
    color:var(--film);
  }
  .intro-title em{
    font-style:italic;
    color:var(--amber);
  }
  .intro-sub{
    font-size:18px;
    line-height:1.55;
    color:rgba(22,36,31,0.78);
    max-width:54ch;
    margin:0 0 30px;
  }
  .intro-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px 28px;
    margin:0 0 36px;
    padding:18px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .meta-item{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--petrol);
  }
  .meta-item b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:600;
    color:var(--film);
    margin-bottom:2px;
  }

  .film-strip{
    display:flex;
    gap:6px;
    margin:0 0 36px;
  }
  .film-strip span{
    flex:1;
    height:34px;
    border:1px solid var(--line);
    background:repeating-linear-gradient(90deg, var(--paper-2), var(--paper-2) 8px, transparent 8px, transparent 16px);
    position:relative;
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:16px;
    border:none;
    cursor:pointer;
    padding:16px 30px;
    border-radius:var(--radius);
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .btn-primary{
    background:var(--film);
    color:var(--paper);
  }
  .btn-primary:hover{
    background:var(--petrol-2);
    transform:translateY(-1px);
    box-shadow:var(--shadow);
  }
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:disabled{
    opacity:0.35;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
  }
  .btn-ghost{
    background:transparent;
    color:var(--petrol);
    padding:14px 6px;
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:5px;
  }
  .btn-ghost:hover{color:var(--film);}

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:34px;
  }

  /* ---------- Section divider (axis intro) ---------- */
  .axis-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--petrol);
    opacity:0.7;
    margin-bottom:10px;
  }
  .axis-tag b{color:var(--amber); opacity:1;}

  /* ---------- Question ---------- */
  .q-kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--amber);
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .q-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(24px, 4.4vw, 32px);
    line-height:1.22;
    color:var(--film);
    margin:0 0 28px;
    max-width:30ch;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .option{
    text-align:left;
    background:rgba(255,255,255,0.5);
    border:1px solid var(--line);
    padding:18px 20px;
    cursor:pointer;
    font-size:16px;
    line-height:1.5;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    gap:14px;
    transition:border-color 0.18s ease, background 0.18s ease, transform 0.12s ease;
    position:relative;
  }
  .option:hover{
    border-color:var(--amber);
    background:rgba(255,255,255,0.85);
    transform:translateX(2px);
  }
  .option.selected{
    border-color:var(--film);
    background:var(--film);
    color:var(--paper);
  }
  .option-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    border:1.5px solid var(--petrol);
    flex-shrink:0;
    margin-top:5px;
    transition:background 0.18s ease, border-color 0.18s ease;
  }
  .option.selected .option-dot{
    background:var(--amber-bright);
    border-color:var(--amber-bright);
  }

  textarea.text-input{
    width:100%;
    font-family:'Source Sans 3', sans-serif;
    font-size:17px;
    padding:18px 20px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.6);
    color:var(--ink);
    resize:vertical;
    min-height:110px;
    line-height:1.5;
  }
  textarea.text-input:focus, input.text-input:focus{
    outline:2px solid var(--amber);
    outline-offset:2px;
    border-color:var(--film);
  }

  /* ---------- Lead capture ---------- */
  .lead-card{
    background:var(--film);
    color:var(--paper);
    padding:44px 36px;
    position:relative;
    overflow:hidden;
  }
  .lead-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(224,162,61,0.06) 0 1px, transparent 1px 38px);
    pointer-events:none;
  }
  .lead-card .axis-tag{color:var(--amber); opacity:0.9;}
  .lead-title{
    font-family:'Fraunces', serif;
    font-size:clamp(26px, 4.8vw, 34px);
    font-weight:600;
    margin:0 0 12px;
    line-height:1.18;
  }
  .lead-sub{
    color:rgba(244,239,228,0.72);
    font-size:16px;
    line-height:1.55;
    margin:0 0 30px;
    max-width:48ch;
  }
  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--amber-bright);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    font-family:'Source Sans 3', sans-serif;
    font-size:17px;
    padding:14px 16px;
    background:rgba(244,239,228,0.06);
    border:1px solid rgba(244,239,228,0.28);
    color:var(--paper);
  }
  .field input::placeholder{color:rgba(244,239,228,0.35);}
  .field input:focus{
    outline:none;
    border-color:var(--amber-bright);
    background:rgba(244,239,228,0.1);
  }
  .field-error{
    font-size:12.5px;
    color:#e6906f;
    margin-top:6px;
    display:none;
  }
  .field.invalid input{border-color:#e6906f;}
  .field.invalid .field-error{display:block;}
  .lead-privacy{
    font-size:12.5px;
    color:rgba(244,239,228,0.45);
    margin-top:18px;
    line-height:1.5;
  }

  /* ---------- Results ---------- */
  .result-header{
    text-align:center;
    margin-bottom:8px;
  }
  .profile-card{
    background:var(--film);
    color:var(--paper);
    padding:48px 32px;
    margin:24px 0 40px;
    position:relative;
  }
  .profile-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:16px;
  }
  .profile-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(28px, 6vw, 42px);
    line-height:1.08;
    margin:0 0 20px;
  }
  .profile-desc{
    font-size:17px;
    line-height:1.6;
    color:rgba(244,239,228,0.82);
    margin:0 0 24px;
    max-width:58ch;
  }
  .profile-symptoms{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid rgba(244,239,228,0.18);
    padding-top:20px;
  }
  .profile-symptoms li{
    font-size:15px;
    line-height:1.6;
    color:rgba(244,239,228,0.78);
    padding-left:20px;
    position:relative;
    margin-bottom:10px;
  }
  .profile-symptoms li::before{
    content:"—";
    position:absolute;
    left:0;
    color:var(--amber);
  }

  .axes-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:40px;
  }
  .axis-row{
    background:var(--paper);
    padding:18px 20px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:16px;
    cursor:pointer;
  }
  .axis-row-num{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--petrol);
    opacity:0.55;
  }
  .axis-row-name{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    color:var(--film);
  }
  .axis-row-status{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:5px 10px;
    white-space:nowrap;
  }
  .status-critico{background:rgba(163,64,47,0.12); color:var(--crit);}
  .status-desenvolvimento{background:rgba(200,134,43,0.14); color:var(--dev);}
  .status-maduro{background:rgba(47,107,79,0.14); color:var(--maturo);}

  .axis-detail{
    grid-column:1 / -1;
    display:none;
    padding-top:16px;
    margin-top:4px;
    border-top:1px dashed var(--line);
  }
  .axis-row.open .axis-detail{display:block;}
  .axis-row.open .chev{transform:rotate(90deg);}
  .chev{
    font-family:'JetBrains Mono', monospace;
    color:var(--petrol);
    transition:transform 0.2s ease;
    opacity:0.5;
  }
  .axis-detail p{
    font-size:15px;
    line-height:1.6;
    color:rgba(22,36,31,0.78);
    margin:0 0 14px;
  }
  .plan-table{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    font-size:14px;
  }
  .plan-table th{
    text-align:left;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--petrol);
    opacity:0.65;
    padding:0 12px 8px 0;
    border-bottom:1px solid var(--line);
  }
  .plan-table td{
    padding:12px 12px 12px 0;
    border-bottom:1px solid var(--line);
    vertical-align:top;
    line-height:1.5;
    color:var(--ink);
  }
  .plan-table tr:last-child td{border-bottom:none;}
  .plan-table td:first-child{font-weight:600; width:26%;}
  .plan-table td:nth-child(3){color:var(--petrol); width:24%; font-size:13.5px;}

  .section-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--petrol);
    opacity:0.7;
    margin:0 0 16px;
  }

  .footer-note{
    text-align:center;
    margin-top:60px;
    padding-top:24px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--petrol);
    opacity:0.55;
  }

  @media (max-width:560px){
    .stage{padding:24px 16px 60px;}
    .lead-card{padding:32px 22px;}
    .profile-card{padding:34px 22px;}
    .axis-row{grid-template-columns:1fr auto; row-gap:8px;}
    .axis-row-num{display:none;}
    .plan-table, .plan-table thead, .plan-table tbody, .plan-table th, .plan-table td, .plan-table tr{display:block;}
    .plan-table thead{display:none;}
    .plan-table tr{margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:10px;}
    .plan-table td{border-bottom:none; padding:3px 0;}
    .plan-table td:first-child{font-family:'JetBrains Mono', monospace; font-size:11px; text-transform:uppercase; color:var(--amber); opacity:0.9; width:auto;}
  }

  @media (prefers-reduced-motion: reduce){
    .screen.active{animation:none;}
    .progress-fill{transition:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark">Raio-X · Evento Cristão</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>
</div>

<div class="stage" id="stage">
  <!-- Screens injected by JS -->
</div>

<script>
// ============================================================
// RAIO-X DO SEU EVENTO CRISTÃO — dados extraídos do material
// ============================================================

const AXES = [
  { id: "proposito", name: "Propósito & Visão", short: "Propósito" },
  { id: "comunicacao", name: "Comunicação & Divulgação", short: "Comunicação" },
  { id: "experiencia", name: "Experiência & Estrutura Física", short: "Experiência" },
  { id: "equipe", name: "Equipe & Operação", short: "Equipe" },
  { id: "tecnologia", name: "Tecnologia, Som & Produção", short: "Tecnologia" },
  { id: "orcamento", name: "Orçamento & Recursos", short: "Orçamento" },
  { id: "conversao", name: "Conversão & Pós-evento", short: "Conversão" },
  { id: "lideranca", name: "Liderança & Espiritualidade do Evento", short: "Liderança" },
];

// Pontuação: alternativa[0] = 3 pts, alternativa[1] = 2 pts, alternativa[2] = 1 pt
const QUESTIONS = [
  // ---- abertura (sem pontuação) ----
  {
    type: "text",
    id: "open1",
    axis: null,
    title: "Em uma palavra, como você descreveria o último evento que sua igreja organizou?",
    placeholder: "Escreva aqui...",
  },
  {
    type: "choice",
    id: "context1",
    axis: null,
    scored: false,
    title: "Há quanto tempo vocês organizam eventos assim?",
    options: [
      "É nosso primeiro evento grande",
      "Já fizemos alguns, mas sem muita constância",
      "Já é tradição, fazemos isso há anos",
    ],
  },

  // ---- Eixo 1 — Propósito & Visão ----
  {
    type: "choice", axis: "proposito",
    title: "Se seu evento fosse um culto, ele seria mais parecido com...",
    options: [
      "Uma liturgia bem ensaiada (cada minuto tem um propósito)",
      "Um avivamento espontâneo (sabemos o que queremos, mas vai do jeito que Deus quiser)",
      "Uma reunião de última hora (genuinamente não sabemos o que vai acontecer)",
    ],
  },
  {
    type: "choice", axis: "proposito",
    title: "Quando alguém pergunta “qual o objetivo desse evento?”, a resposta da equipe é...",
    options: [
      "Uma frase só, todo mundo fala igual",
      "Cada um dá uma resposta diferente",
      "Um silêncio constrangedor seguido de “...adorar a Deus, né?”",
    ],
  },
  {
    type: "choice", axis: "proposito",
    title: "O público-alvo do seu evento é...",
    options: [
      "Muito claro: sabemos exatamente quem queremos alcançar",
      "Meio genérico: “é pra todo mundo”",
      "Nunca paramos pra pensar nisso",
    ],
  },

  // ---- Eixo 2 — Comunicação & Divulgação ----
  {
    type: "choice", axis: "comunicacao",
    title: "Sua divulgação de evento se parece mais com...",
    options: [
      "Netflix: trailer, teaser, contagem regressiva",
      "Rádio AM: uma vez no grupo do WhatsApp e pronto",
      "Telefone sem fio: alguém espalha, ninguém confere",
    ],
  },
  {
    type: "choice", axis: "comunicacao",
    title: "Se seu evento fosse posto à prova num feed do Instagram, ele teria...",
    options: [
      "Conteúdo toda semana, stories, bastidores",
      "Um post de capa e um story no dia",
      "Foto tirada de última hora, com o flash estourado",
    ],
  },
  {
    type: "choice", axis: "comunicacao",
    title: "Quando alguém pergunta “como fico sabendo dos próximos eventos de vocês?”, você responde...",
    options: [
      "Tem um canal fixo (WhatsApp, app, newsletter) e a pessoa nunca perde nada",
      "Depende da sorte de ver o post no feed",
      "Honestamente, nem a gente sabe direito",
    ],
  },

  // ---- Eixo 3 — Experiência & Estrutura Física ----
  {
    type: "choice", axis: "experiencia",
    title: "No dia do evento, o público geralmente sente que...",
    options: [
      "Foi cuidado em cada detalhe, do estacionamento ao café",
      "Foi bom, mas meio corrido e improvisado",
      "Ficou perdido sobre onde sentar, o que vai acontecer e quando acaba",
    ],
  },
  {
    type: "choice", axis: "experiencia",
    title: "Se seu evento fosse um restaurante, seria...",
    options: [
      "Um buffet bem servido, com cardápio definido",
      "Um fast-food: rápido, ok, mas sem encantar",
      "Aquele lugar que demora, erra o pedido e ainda fica sem mesa",
    ],
  },
  {
    type: "choice", axis: "experiencia",
    title: "A sinalização e acolhimento de quem chega pela primeira vez é...",
    options: [
      "Impecável: tem gente na porta, placas, recepção treinada",
      "Existe, mas só se alguém lembrar de fazer",
      "Inexistente: a pessoa se vira sozinha",
    ],
  },
  {
    type: "choice", axis: "experiencia",
    title: "O tempo de duração do seu evento costuma...",
    options: [
      "Bater exatamente com o planejado",
      "Estourar um pouco, mas sem ninguém notar muito",
      "Virar uma maratona que cansa até a equipe",
    ],
  },

  // ---- Eixo 4 — Equipe & Operação ----
  {
    type: "choice", axis: "equipe",
    title: "Sua equipe de bastidores no dia do evento está mais para...",
    options: [
      "Time olímpico: cada um sabe exatamente sua função",
      "Mutirão: todo mundo ajuda em tudo, meio sem dono",
      "Última hora: “quem que ficou de trazer o microfone?!”",
    ],
  },
  {
    type: "choice", axis: "equipe",
    title: "Quando algo dá errado no meio do evento (e sempre dá), a equipe...",
    options: [
      "Resolve discretamente, ninguém na plateia percebe",
      "Resolve, mas todo mundo vê o sufoco",
      "Trava, e o evento para até alguém decidir o que fazer",
    ],
  },

      ["Releia os 8 mini raio-x abaixo", "Identifique os eixos classificados como Crítico ou Em Desenvolvimento", "Logo após receber este diagnóstico"],

<script>
// ============================================================
// APP — Raio-X do seu Evento Cristão
// ============================================================

(function () {
  "use strict";

  // ============================================================
  // CONFIGURAÇÃO DO HUBSPOT
  // ============================================================
  // Troque os valores abaixo pelos dados do seu formulário no HubSpot.
  // Portal ID: Configurações > Contas e Faturamento > Detalhes da Conta
  // Form GUID: Marketing > Formulários > [seu formulário] > Compartilhar > Incorporar código
  const HUBSPOT_CONFIG = {
    portalId: "49424759",
    formGuid: "6ac88aad-7635-4e70-8197-3756c791f06f",
    // Nomes internos dos campos no HubSpot. Ajuste se o seu formulário usar nomes diferentes.
    fieldNames: {
      name: "firstname",
      email: "email",
      whatsapp: "phone",
    },
  };

  function getHubspotCookie() {
    const match = document.cookie.match(/(?:^|;\s*)hubspotutk=([^;]+)/);
    return match ? match[1] : null;
  }

  function sendLeadToHubSpot(leadData) {
    if (
      !HUBSPOT_CONFIG.portalId ||
      HUBSPOT_CONFIG.portalId === "SEU_PORTAL_ID" ||
      !HUBSPOT_CONFIG.formGuid ||
      HUBSPOT_CONFIG.formGuid === "SEU_FORM_GUID"
    ) {
      console.warn("HubSpot não configurado: preencha HUBSPOT_CONFIG.portalId e formGuid.");
      return;
    }

    const endpoint = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_CONFIG.portalId}/${HUBSPOT_CONFIG.formGuid}`;

    const payload = {
      fields: [
        { name: HUBSPOT_CONFIG.fieldNames.name, value: leadData.name },
        { name: HUBSPOT_CONFIG.fieldNames.email, value: leadData.email },
        { name: HUBSPOT_CONFIG.fieldNames.whatsapp, value: leadData.whatsapp },
      ],
      context: {
        pageUri: window.location.href,
        pageName: document.title,
      },
    };

    const hutk = getHubspotCookie();
    if (hutk) {
      payload.context.hutk = hutk;
    }

    fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then((res) => {
        if (!res.ok) {
          return res.json().then((err) => {
            console.error("Erro ao enviar lead para o HubSpot:", err);
          });
        }
      })
      .catch((err) => {
        console.error("Falha de rede ao enviar lead para o HubSpot:", err);
      });
  }

  const stage = document.getElementById("stage");
  const progressFill = document.getElementById("progressFill");
  const progressPct = document.getElementById("progressPct");

  // answers[questionIndex] = { axis, points } or { text } or { choiceIndex }
  const answers = new Array(QUESTIONS.length).fill(null);
  let currentIndex = -1; // -1 = intro screen
  let leadSubmitted = false;
  const lead = { name: "", email: "", whatsapp: "" };

  // total screens = 1 (intro) + QUESTIONS.length + 1 (lead) + 1 (result) = handled via currentIndex
  const TOTAL_STEPS = QUESTIONS.length; // used for progress bar across questions only

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function updateProgress() {
    let pct = 0;
    if (currentIndex < 0) pct = 0;
    else if (currentIndex >= TOTAL_STEPS) pct = 100;
    else pct = Math.round(((currentIndex + 1) / (TOTAL_STEPS + 2)) * 100);
    progressFill.style.width = pct + "%";
    progressPct.textContent = pct + "%";
  }

  // ---------------------------------------------------------
  // Render: Intro
  // ---------------------------------------------------------
  function renderIntro() {
    stage.innerHTML = `
      <div class="screen active">
        <span class="intro-eyebrow">Diagnóstico gratuito · 7 minutos</span>
        <h1 class="intro-title">Raio-X do <em>seu evento</em> cristão</h1>
        <p class="intro-sub">22 perguntas rápidas para enxergar, com clareza, o que está sustentando — e o que está travando — o próximo evento da sua igreja. Sem enrolação, sem julgamento. Só um retrato honesto e um plano de ação.</p>

        <div class="film-strip" aria-hidden="true">
          ${AXES.map(() => "<span></span>").join("")}
        </div>

        <div class="intro-meta">
          <div class="meta-item"><b>8</b>eixos avaliados</div>
          <div class="meta-item"><b>22</b>perguntas objetivas</div>
          <div class="meta-item"><b>6</b>perfis possíveis</div>
          <div class="meta-item"><b>~7min</b>para concluir</div>
        </div>

        <button class="btn btn-primary" id="startBtn">Começar meu diagnóstico →</button>
      </div>
    `;
    document.getElementById("startBtn").addEventListener("click", () => {
      currentIndex = 0;
      renderQuestion();
    });
    updateProgress();
  }

  // ---------------------------------------------------------
  // Render: Question (choice or text)
  // ---------------------------------------------------------
  function renderQuestion() {
    const q = QUESTIONS[currentIndex];
    const axisMeta = q.axis ? AXES.find((a) => a.id === q.axis) : null;
    const axisNumber = axisMeta ? AXES.findIndex((a) => a.id === q.axis) + 1 : null;

    let kicker = "";
    if (axisMeta) {
      kicker = `Eixo ${axisNumber} de 8 · ${axisMeta.short}`;
    } else if (q.id === "open1" || q.id === "context1") {
      kicker = "Abertura";
    } else {
      kicker = "Fechamento";
    }

    let bodyHtml = "";
    if (q.type === "choice") {
      const saved = answers[currentIndex];
      bodyHtml = `
        <div class="options" role="group" aria-label="${escapeHtml(q.title)}">
          ${q.options
            .map((opt, i) => {
              const selected = saved && saved.choiceIndex === i ? "selected" : "";
              return `<button type="button" class="option ${selected}" data-index="${i}">
                <span class="option-dot"></span><span>${escapeHtml(opt)}</span>
              </button>`;
            })
            .join("")}
        </div>
      `;
    } else {
      const savedText = answers[currentIndex] ? answers[currentIndex].text : "";
      bodyHtml = `<textarea class="text-input" id="textAnswer" placeholder="${escapeHtml(
        q.placeholder || "Escreva aqui..."
      )}">${escapeHtml(savedText)}</textarea>`;
    }

    stage.innerHTML = `
      <div class="screen active">
        <div class="q-kicker">${kicker}</div>
        <h2 class="q-title">${escapeHtml(q.title)}</h2>
        ${bodyHtml}
        <div class="nav-row">
          <button class="btn btn-ghost" id="backBtn">${currentIndex === 0 ? "" : "← Voltar"}</button>
          <button class="btn btn-primary" id="nextBtn" ${q.type === "text" ? "" : "disabled"}>
            ${currentIndex === QUESTIONS.length - 1 ? "Ver meu diagnóstico →" : "Próxima →"}
          </button>
        </div>
      </div>
    `;

    if (currentIndex === 0) {
      const backBtn = document.getElementById("backBtn");
      backBtn.style.visibility = "hidden";
    } else {
      document.getElementById("backBtn").addEventListener("click", goBack);
    }

    const nextBtn = document.getElementById("nextBtn");

    if (q.type === "choice") {
      const optionEls = stage.querySelectorAll(".option");
      optionEls.forEach((el) => {
        el.addEventListener("click", () => {
          optionEls.forEach((o) => o.classList.remove("selected"));
          el.classList.add("selected");
          const idx = parseInt(el.dataset.index, 10);
          const points = q.scored === false ? null : 3 - idx; // first=3, second=2, third=1
          answers[currentIndex] = { choiceIndex: idx, axis: q.axis, points: points };
          nextBtn.disabled = false;
        });
      });
    } else {
      const textarea = document.getElementById("textAnswer");
      const checkText = () => {
        nextBtn.disabled = textarea.value.trim().length === 0;
        answers[currentIndex] = { text: textarea.value };
      };
      textarea.addEventListener("input", checkText);
      checkText();
    }

    nextBtn.addEventListener("click", goNext);
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goNext() {
    if (currentIndex < QUESTIONS.length - 1) {
      currentIndex += 1;
      renderQuestion();
    } else {
      currentIndex = QUESTIONS.length; // lead capture screen marker
      renderLeadCapture();
    }
  }

  function goBack() {
    if (currentIndex > 0) {
      currentIndex -= 1;
      renderQuestion();
    } else {
      currentIndex = -1;
      renderIntro();
    }
  }

  // ---------------------------------------------------------
  // Scoring
  // ---------------------------------------------------------
  function computeAxisLevels() {
    const sums = {};
    const counts = {};
    AXES.forEach((a) => {
      sums[a.id] = 0;
      counts[a.id] = 0;
    });

    answers.forEach((ans, i) => {
      const q = QUESTIONS[i];
      if (q.type === "choice" && q.axis && ans && typeof ans.points === "number") {
        sums[q.axis] += ans.points;
        counts[q.axis] += 1;
      }
    });

    const averages = {};
    const levels = {};
    AXES.forEach((a) => {
      const avg = counts[a.id] > 0 ? sums[a.id] / counts[a.id] : 0;
      averages[a.id] = avg;
      if (avg >= 2.4) levels[a.id] = "maduro";
      else if (avg >= 1.7) levels[a.id] = "desenvolvimento";
      else levels[a.id] = "critico";
    });

    const levelsCount = { critico: 0, desenvolvimento: 0, maduro: 0 };
    Object.values(levels).forEach((lv) => levelsCount[lv]++);

    return { averages, levels, levelsCount };
  }

  function pickProfile(levels, levelsCount) {
    for (const profile of PROFILES) {
      try {
        if (profile.matches(levels, levelsCount)) return profile;
      } catch (e) {
        /* ignore */
      }
    }
    return FALLBACK_PROFILE_BUILDER(levelsCount);
  }

  // ---------------------------------------------------------
  // Render: Lead capture
  // ---------------------------------------------------------
  function renderLeadCapture() {
    stage.innerHTML = `
      <div class="screen active">
        <div class="lead-card">
          <div class="axis-tag">Diagnóstico concluído</div>
          <h2 class="lead-title">Seu diagnóstico está pronto! Preencha os campos abaixo para acessar.*</h2>
          <p class="lead-sub">Seu perfil geral e os 8 mini raio-x do seu evento já foram calculados. Só falta isso para você ver o resultado completo.</p>

          <div class="field" id="field-name">
            <label for="inputName">Nome*</label>
            <input type="text" id="inputName" placeholder="Seu nome completo" autocomplete="name" value="${escapeHtml(lead.name)}">
            <div class="field-error">Digite seu nome.</div>
          </div>

          <div class="field" id="field-email">
            <label for="inputEmail">E-mail*</label>
            <input type="email" id="inputEmail" placeholder="voce@email.com" autocomplete="email" value="${escapeHtml(lead.email)}">
            <div class="field-error">Digite um e-mail válido.</div>
          </div>

          <div class="field" id="field-whatsapp">
            <label for="inputWhatsapp">WhatsApp*</label>
            <input type="tel" id="inputWhatsapp" placeholder="(00) 00000-0000" autocomplete="tel" value="${escapeHtml(lead.whatsapp)}">
            <div class="field-error">Digite um número de WhatsApp válido.</div>
          </div>

          <button class="btn btn-primary" id="revealBtn" style="width:100%; justify-content:center; margin-top:8px;">Ver meu diagnóstico completo →</button>
          <p class="lead-privacy">Seus dados são usados apenas para enviar seu diagnóstico e um eventual contato sobre como aplicá-lo. Nada de spam.</p>
        </div>

        <div class="nav-row" style="margin-top:18px;">
          <button class="btn btn-ghost" id="backBtn">← Voltar às perguntas</button>
          <span></span>
        </div>
      </div>
    `;

    document.getElementById("backBtn").addEventListener("click", () => {
      currentIndex = QUESTIONS.length - 1;
      renderQuestion();
    });

    document.getElementById("revealBtn").addEventListener("click", validateAndReveal);

    // Enter key submits
    ["inputName", "inputEmail", "inputWhatsapp"].forEach((id) => {
      document.getElementById(id).addEventListener("keydown", (e) => {
        if (e.key === "Enter") validateAndReveal();
      });
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
  }

  function isValidWhatsapp(value) {
    const digits = value.replace(/\D/g, "");
    return digits.length >= 10 && digits.length <= 13;
  }

  function validateAndReveal() {
    const nameEl = document.getElementById("inputName");
    const emailEl = document.getElementById("inputEmail");
    const waEl = document.getElementById("inputWhatsapp");

    const nameVal = nameEl.value.trim();
    const emailVal = emailEl.value.trim();
    const waVal = waEl.value.trim();

    let valid = true;

    const nameField = document.getElementById("field-name");
    if (nameVal.length < 2) {
      nameField.classList.add("invalid");
      valid = false;
    } else {
      nameField.classList.remove("invalid");
    }

    const emailField = document.getElementById("field-email");
    if (!isValidEmail(emailVal)) {
      emailField.classList.add("invalid");
      valid = false;
    } else {
      emailField.classList.remove("invalid");
    }

    const waField = document.getElementById("field-whatsapp");
    if (!isValidWhatsapp(waVal)) {
      waField.classList.add("invalid");
      valid = false;
    } else {
      waField.classList.remove("invalid");
    }

    if (!valid) return;

    lead.name = nameVal;
    lead.email = emailVal;
    lead.whatsapp = waVal;
    leadSubmitted = true;

    sendLeadToHubSpot(lead);

    currentIndex = QUESTIONS.length + 1;
    renderResult();
  }

  // ---------------------------------------------------------
  // Render: Result
  // ---------------------------------------------------------
  function renderResult() {
    if (!leadSubmitted) {
      currentIndex = QUESTIONS.length;
      renderLeadCapture();
      return;
    }

    const { averages, levels, levelsCount } = computeAxisLevels();
    const profile = pickProfile(levels, levelsCount);
    const firstName = lead.name.trim().split(/\s+/)[0];

    const axesRowsHtml = AXES.map((a, idx) => {
      const lv = levels[a.id];
      const diag = AXIS_DIAGNOSIS[a.id][lv];
      const statusClass = "status-" + lv;
      const planRows = diag.plan
        .map(
          (row) => `
        <tr>
          <td>${escapeHtml(row[0])}</td>
          <td>${escapeHtml(row[1])}</td>
          <td>${escapeHtml(row[2])}</td>
        </tr>`
        )
        .join("");

      return `
        <div class="axis-row" data-axis="${a.id}">
          <span class="axis-row-num">${String(idx + 1).padStart(2, "0")}</span>
          <span class="axis-row-name">${escapeHtml(a.name)} <span class="chev">›</span></span>
          <span class="axis-row-status ${statusClass}">${diag.label}</span>
          <div class="axis-detail">
            <p><strong>${escapeHtml(diag.headline)}</strong> ${escapeHtml(diag.body)}</p>
            <p style="margin-bottom:6px;"><strong>Sintomas comuns:</strong></p>
            <ul class="profile-symptoms" style="margin-bottom:18px;">
              ${diag.symptoms.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}
            </ul>
            <p style="margin-bottom:6px;"><strong>Plano de ação:</strong></p>
            <table class="plan-table">
              <thead><tr><th>O que fazer</th><th>Como fazer</th><th>Quando fazer</th></tr></thead>
              <tbody>${planRows}</tbody>
            </table>
          </div>
        </div>
      `;
    }).join("");

    const profilePlanRows = profile.plan
      .map(
        (row) => `
      <tr>
        <td>${escapeHtml(row[0])}</td>
        <td>${escapeHtml(row[1])}</td>
        <td>${escapeHtml(row[2])}</td>
      </tr>`
      )
      .join("");

    stage.innerHTML = `
      <div class="screen active">
        <div class="result-header">
          <div class="section-label">Diagnóstico de ${escapeHtml(firstName || "você")}</div>
        </div>

        <div class="profile-card">
          <div class="profile-eyebrow">Perfil geral do seu evento</div>
          <h2 class="profile-name">${escapeHtml(profile.name)}</h2>
          <p class="profile-desc">${escapeHtml(profile.desc)}</p>
          <ul class="profile-symptoms">
            ${profile.symptoms.map((s) => `<li>${escapeHtml(s)}</li>`).join("")}
          </ul>
        </div>

        <div class="section-label">Plano de ação prioritário</div>
        <table class="plan-table" style="margin-bottom:44px;">
          <thead><tr><th>O que fazer</th><th>Como fazer</th><th>Quando fazer</th></tr></thead>
          <tbody>${profilePlanRows}</tbody>
        </table>

        <div class="section-label">Os 8 mini raio-x do seu evento — toque para abrir o plano de cada eixo</div>
        <div class="axes-grid">
          ${axesRowsHtml}
        </div>

        <div class="footer-note">
          Raio-X do seu Evento Cristão · diagnóstico gerado para ${escapeHtml(lead.email)}
        </div>
      </div>
    `;

    stage.querySelectorAll(".axis-row").forEach((row) => {
      row.addEventListener("click", () => {
        row.classList.toggle("open");
      });
    });

    currentIndex = QUESTIONS.length + 1;
    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------------------------------------------------------
  // Init
  // ---------------------------------------------------------
  renderIntro();
})();

</script>
</body>
</html>
